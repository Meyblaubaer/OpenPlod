name: Release
# REL-07: builds desktop bundles for a version tag, writes SHA256SUMS.txt and drafts a
# GitHub release. Signing, notarization and signed updater artifacts are enabled only
# when the matching repository secrets exist; without them the build still succeeds
# and the draft release says the artifacts are unsigned (see scripts/release-config.ts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --cwd web --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run --cwd web lint

  bundle:
    needs: checks
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/plaud-bridge
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: bun install --frozen-lockfile
      - run: bun install --cwd web --frozen-lockfile
      - name: Export signing configuration that is present
        # Secrets that are not configured stay unset, so Tauri does not try to use empty values.
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in TAURI_UPDATER_PUBKEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            # Apple credentials are only meaningful on the macOS runner.
            if [ "$RUNNER_OS" != "macOS" ] && [[ "$name" == APPLE_* ]]; then continue; fi
            if [ -n "$value" ]; then
              {
                echo "$name<<__OPENPLOD_EOF__"
                echo "$value"
                echo "__OPENPLOD_EOF__"
              } >> "$GITHUB_ENV"
            fi
          done
      - name: Write release configuration
        run: bun run scripts/release-config.ts
      - name: Build bundles
        shell: bash
        # Linux ships the .deb and .rpm documented in the README; the AppImage step (linuxdeploy)
        # cannot bundle the compiled sidecar on the hosted runner.
        run: bunx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json ${{ runner.os == 'Linux' && '--bundles deb,rpm' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe

  release:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*
          merge-multiple: true
      - name: Collect files and write SHA256SUMS.txt
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_UPDATES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          MAC_SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        shell: bash
        run: |
          notes="Draft built by CI. Verify downloads with: sha256sum -c SHA256SUMS.txt"
          [ "$MAC_SIGNED" = "true" ] || notes="$notes
          macOS build is ad-hoc signed and not notarized (no signing secrets configured)."
          [ "$SIGNED_UPDATES" = "true" ] || notes="$notes
          No signed updater artifacts (no updater signing key configured)."
          # An existing release (written by hand) keeps its notes; CI only attaches the build.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "OpenPlod $GITHUB_REF_NAME" --notes "$notes" release/*
          fi
